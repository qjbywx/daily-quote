<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 针对手机屏幕自适应，并隐藏浏览器地址栏（添加到主屏幕时体验类似App） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>粒子汇聚爱心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            overflow: hidden; /* 隐藏滚动条 */
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        
        // 屏幕适配
        let WIDTH, HEIGHT;
        function resize() {
            WIDTH = canvas.width = window.innerWidth;
            HEIGHT = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 颜色定义 (粉色系)
        const COLORS = ['#ff69b4', '#ffb6c1', '#ba55d3', '#dcb4dc'];
        
        // 爱心参数方程
        function getHeartPoint(t) {
            let x = 16 * Math.pow(Math.sin(t), 3);
            let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
            return { x: x, y: -y }; // 翻转Y轴
        }

        // 粒子类
        class Particle {
            constructor(targetX, targetY) {
                this.tx = targetX;
                this.ty = targetY;
                
                // 初始位置：屏幕底部随机
                this.x = Math.random() * WIDTH;
                this.y = HEIGHT + Math.random() * 200 + 100;
                
                // 物理属性
                this.speed = Math.random() * 1.4 + 0.8; // 0.8 ~ 2.2
                this.acceleration = 0.12;
                this.vx = 0;
                this.vy = 0;
                this.arrived = false;
                
                // 视觉属性
                this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
                this.size = Math.random() * 3 + 1;
                this.alpha = Math.random() * 0.3 + 0.7;
                this.wobblePhase = Math.random() * Math.PI * 2;
            }

            update(currentScale) {
                // 根据全局缩放计算实际目标位置
                // 这里的 20 是基准缩放系数，用于适配屏幕大小
                const scaleFactor = currentScale / 20;
                const targetX = this.tx * scaleFactor + WIDTH / 2;
                const targetY = this.ty * scaleFactor + HEIGHT / 2;

                if (!this.arrived) {
                    let dx = targetX - this.x;
                    let dy = targetY - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 3) { // 到达阈值
                        this.arrived = true;
                        this.x = targetX;
                        this.y = targetY;
                        return;
                    }

                    // 归一化方向 + 加速度
                    dx /= dist;
                    dy /= dist;
                    this.vx += dx * this.acceleration;
                    this.vy += dy * this.acceleration;

                    // 限制最大速度
                    let velMag = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                    if (velMag > this.speed) {
                        this.vx = (this.vx / velMag) * this.speed;
                        this.vy = (this.vy / velMag) * this.speed;
                    }

                    this.x += this.vx;
                    this.y += this.vy;
                } else {
                    // 到达后：独立呼吸抖动
                    let wobbleAmt = 0.8 * Math.sin(Date.now() * 0.01 + this.wobblePhase);
                    this.x = targetX + wobbleAmt;
                    this.y = targetY + wobbleAmt;
                }
            }

            draw() {
                // 绘制光晕 (仅到达目标的粒子)
                if (this.arrived) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 182, 193, ${this.alpha * 0.3})`;
                    ctx.fill();
                }

                // 绘制粒子本体
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.fill();
                ctx.globalAlpha = 1.0; // 恢复透明度
            }
        }

        // 主程序
        let particles = [];
        const numPoints = 1200; // 手机端优化，1200个粒子已经足够密集且不卡顿
        const baseScale = 20.0; // 基准大小
        let breathPhase = 0;
        const breathSpeed = 0.05; // 呼吸节奏
        const breathRange = 2.0; // 缩放幅度

        // 生成粒子
        function initParticles() {
            particles = [];
            for (let i = 0; i < numPoints; i++) {
                let t = (i / numPoints) * Math.PI * 2;
                let point = getHeartPoint(t);
                // 这里 tx, ty 存的是基准坐标，update 里会加上屏幕中心和动态缩放
                particles.push(new Particle(point.x * 10, point.y * 10)); 
            }
        }

        // 动画循环
        function animate() {
            // 1. 绘制拖尾效果 (用半透明黑色覆盖，产生残影)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)'; 
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // 2. 呼吸缩放计算
            let currentScale = baseScale + breathRange * Math.sin(breathPhase);
            breathPhase += breathSpeed;

            // 3. 更新并绘制所有粒子
            for (let p of particles) {
                p.update(currentScale);
                p.draw();
            }

            // 4. 循环下一帧
            requestAnimationFrame(animate);
        }

        // 启动
        initParticles();
        animate();

    </script>
</body>
</html>
