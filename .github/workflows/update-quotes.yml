name: 每日句子自动更新

on:
  schedule:
    - cron: '5 16 * * *' # 北京时间每天 00:05（UTC 16:05）
  workflow_dispatch: # 支持手动触发，便于首次测试

permissions:
  contents: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取、去重并填充句子
        run: node scripts/update-quotes.mjs

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json history.json
          if git diff --cached --quiet; then
            echo "没有新句子，无需提交"
          else
            git commit -m "chore: 自动更新句子库与抓取记录 $(date -u +%Y-%m-%d)"
            git push
          fi
